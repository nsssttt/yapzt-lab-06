name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Approved same-repository pull request into develop (optional)'
        type: number
        required: false
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested]
    branches:
      - develop
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  review-check:
    if: github.event.pull_request.base.ref == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.pull_request > 0)
    needs: test
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check the target branch
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: test "$BASE_REF" = "develop"
      - name: Check the latest review decisions
        uses: actions/github-script@v7
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const pullNumber = manual ? Number(context.payload.inputs.pull_request) : context.payload.pull_request.number;
            if (manual) {
              const { data: pull } = await github.rest.pulls.get({
                ...context.repo, pull_number: pullNumber
              });
              if (pull.state !== 'open' || pull.base.ref !== 'develop' ||
                  pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  pull.head.sha !== context.sha) {
                core.setFailed('Run this workflow on the same-repository head of an open pull request into develop.');
                return;
              }
            }
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pullNumber }
            );
            const latestByUser = new Map();
            for (const review of reviews) {
              if (review.user && review.submitted_at) {
                const previous = latestByUser.get(review.user.login);
                if (!previous || previous.submitted_at < review.submitted_at) {
                  latestByUser.set(review.user.login, review);
                }
              }
            }
            const latest = [...latestByUser.values()];
            core.info(JSON.stringify(latest.map(({ user, state, submitted_at }) =>
              ({ user: user.login, state, submitted_at })), null, 2));
            if (!latest.some(review => review.state === 'APPROVED')) {
              core.setFailed('The pull request into develop has no active approval.');
            }

  analysis:
    permissions:
      contents: read
      pull-requests: write
    if: github.event.pull_request.base.ref == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.pull_request > 0)
    needs: [test, review-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post flake8 findings to the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: reviewdog/action-flake8@v3.15.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          filter_mode: added
          fail_level: error
      - name: Post Black findings to the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: reviewdog/action-black@v3.22.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info
          filter_mode: added
      - name: Count lines of code
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc
          cloc src --json --out=cloc-report.json
          cat cloc-report.json
      - name: Upload the Cloc report
        uses: actions/upload-artifact@v4
        with:
          name: cloc-report
          path: cloc-report.json
          retention-days: 14

  sonarqube:
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_dispatch' &&
          ((inputs.pull_request > 0 && needs.review-check.result == 'success') ||
           (!(inputs.pull_request > 0) && github.ref == 'refs/heads/main'))
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.review-check.result == 'success'
        )
      )
    needs: [test, review-check]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate coverage data
        run: |
          python -m pip install --disable-pip-version-check coverage
          python -m coverage run --source=src -m unittest discover -s tests -v
          python -m coverage xml
      - name: Start an isolated SonarQube server
        env:
          SONARQUBE_IMAGE: sonarqube@sha256:65541accbdb92e27fe770fc6ba99988a3dd5a0c71ffafd67f88abfad366996fa
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=524288
          docker run --detach --name lab06-sonarqube \
            --publish 127.0.0.1:9000:9000 \
            --env SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            "$SONARQUBE_IMAGE"
      - name: Wait for SonarQube to start
        run: |
          set -euo pipefail
          for ((attempt = 1; attempt <= 120; attempt++)); do
            status=$(curl --silent --show-error --max-time 5 http://127.0.0.1:9000/api/system/status || true)
            if [[ "$status" == *'"status":"UP"'* ]]; then
              echo "SonarQube is ready."
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not start within 10 minutes." >&2
          exit 1
      - name: Run SonarQube analysis and check the quality gate
        env:
          SCANNER_IMAGE: sonarsource/sonar-scanner-cli@sha256:6e6eca4d552695a98fb7dab84f0c1bd0885ebbfe272654d1552e24bd7f452d51
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/sonarqube.netrc"
          admin_password="Runner-$(openssl rand -hex 24)!A9"
          printf 'machine 127.0.0.1\nlogin admin\npassword admin\n' > "$credential_file"
          chmod 600 "$credential_file"

          curl --fail --silent --show-error --netrc-file "$credential_file" \
            --request POST http://127.0.0.1:9000/api/users/change_password \
            --data-urlencode 'login=admin' \
            --data-urlencode "password=$admin_password" \
            --data-urlencode 'previousPassword=admin'
          printf 'machine 127.0.0.1\nlogin admin\npassword %s\n' "$admin_password" > "$credential_file"
          token_response=$(curl --fail --silent --show-error --netrc-file "$credential_file" \
            --request POST http://127.0.0.1:9000/api/user_tokens/generate \
            --data-urlencode "name=lab06-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          sonar_token=$(jq --exit-status --raw-output '.token | select(type == "string" and length > 0)' <<< "$token_response")
          echo "::add-mask::$sonar_token"
          rm -f "$credential_file"

          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env SONAR_HOST_URL=http://127.0.0.1:9000 \
            --env SONAR_TOKEN="$sonar_token" \
            --env SONAR_USER_HOME=/tmp/.sonar \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            "$SCANNER_IMAGE" \
            "-Dsonar.working.directory=$GITHUB_WORKSPACE/.scannerwork" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
          echo 'SonarQube analysis completed and the Quality Gate passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Show SonarQube logs on failure
        if: failure()
        run: docker logs lab06-sonarqube || true
      - name: Stop the temporary SonarQube server
        if: always()
        run: |
          docker rm --force --volumes lab06-sonarqube >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/sonarqube.netrc"
